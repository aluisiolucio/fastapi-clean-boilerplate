_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

_message_after_copy: |
  Projeto "{{ project_name }}" gerado em {{ _copier_conf.dst_path }}.

  Próximos passos:

    cd {{ _copier_conf.dst_path }}
    uv sync
    cp .env.example .env   # ajuste SECRET_KEY (>= 32 caracteres) e DATABASE_URL
    uv run poe migrate
    uv run poe run

project_name:
  type: str
  help: Nome de exibição do projeto
  default: My API

project_slug:
  type: str
  help: Slug usado em pacotes, imports e diretórios
  default: "{{ project_name | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('^_|_$', '') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use apenas letras minúsculas, dígitos e underscore; comece com letra.
    {% endif %}

async_mode:
  type: str
  help: Modo de execução da API (def vs async def, Session vs AsyncSession)
  choices:
    Synchronous: sync
    Asynchronous: async
  default: sync

author_name:
  type: str
  help: Nome do autor (pyproject e LICENSE)
  default: Aluisio Lucio

author_email:
  type: str
  help: E-mail do autor
  default: aluisio18lucio@gmail.com

license:
  type: str
  help: Licença do projeto gerado
  choices:
    - MIT
    - Apache-2.0
  default: MIT

include_docker:
  type: bool
  help: Incluir Dockerfile e docker-compose.yml
  default: true
